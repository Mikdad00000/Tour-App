name: Build APK

on:
  push:
    branches: ['claude/**', 'main']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Scaffold Android shell
        # `flutter create --overwrite` regenerates pubspec.yaml, lib/main.dart,
        # README, etc. We need it for the Android directory, so we let it
        # overwrite, then restore our checked-in sources from git.
        run: |
          flutter create . \
            --platforms=android \
            --project-name=tour_app \
            --org=com.touraapp \
            --overwrite
          # Restore everything that flutter create might have clobbered.
          # Android stays as freshly-generated EXCEPT our manifest.
          git checkout HEAD -- \
            pubspec.yaml \
            README.md \
            analysis_options.yaml \
            lib/ test/ functions/ \
            firebase.json firestore.rules firestore.indexes.json
          # Apply our custom AndroidManifest (BLE/location/notification perms)
          cp android/app/src/main/AndroidManifest.template.xml \
             android/app/src/main/AndroidManifest.xml

      - name: Inject Firebase config (optional)
        # Provide these as repo Secrets to enable real Firebase at runtime:
        #   FIREBASE_OPTIONS_DART     - contents of lib/core/config/firebase_options.dart
        #   GOOGLE_SERVICES_JSON      - contents of android/app/google-services.json
        # Without them the APK still installs and the UI is browsable, but any
        # Firebase call (login, save) will fail at runtime.
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$FIREBASE_OPTIONS_DART" ]; then
            printf '%s' "$FIREBASE_OPTIONS_DART" > lib/core/config/firebase_options.dart
            echo "Wrote firebase_options.dart from secret"
          else
            echo "No FIREBASE_OPTIONS_DART secret — using stub (Firebase will fail at runtime)"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Wrote google-services.json from secret"
          else
            echo "No GOOGLE_SERVICES_JSON secret — Gradle plugin will be skipped"
          fi

      - name: pub get
        run: flutter pub get

      - name: Code generation (drift, freezed, json)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run unit tests
        run: flutter test

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tour-app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Build APK (release, unsigned)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
